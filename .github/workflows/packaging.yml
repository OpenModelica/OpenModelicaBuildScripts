# Fast checks on the packaging scripts in this repository.
#
# Nothing here builds OpenModelica; that takes hours and lives in
# build-packages.yml. What is left to check in seconds is the scripts themselves:
# they drive a multi-hour build, so a mistake in them should fail here rather than
# at the end of one.
#
# What goes into which package is defined in the OpenModelica repository
# (cmake/packaging/), and checked by its own CI.
name: packaging

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: command -v shellcheck || (sudo apt-get update -qq && sudo apt-get install -qy shellcheck)
      - name: shellcheck
        run: shellcheck cpack/*.sh
